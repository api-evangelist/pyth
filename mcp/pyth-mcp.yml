server:
  name: pyth
  transport: http
  url: https://mcp.pyth.network/mcp
  self_hosting: not required (hosted); optional local build via @pythnetwork/mcp in pyth-crosschain
auth:
  endpoint_level: none
  tool_level: Pyth Pro API key passed as `access_token` argument on price tools
  notes: get_symbols and convert_date_to_timestamp need no key. get_latest_price requires access_token;
    get_historical_price and get_candlestick_data require it as of 2026-07-24.
recommended_workflow: get_symbols -> get_latest_price / get_historical_price -> get_candlestick_data
tools:
- name: get_symbols
  description: 'List available Pyth Pro price feeds. Use this FIRST to discover what feeds exist before
    calling get_latest_price, get_historical_price, get_price_range or get_candlestick_data (those also
    accept bare pairs like BTC/USD). Filter by asset_type (e.g. crypto, equity, fx, metal, commodity,
    interest-rate, funding-rate, kalshi) or search by name/symbol. Narrow further with instrument_type
    (spot, future, ...) or symbol_chain_id (all contracts of one futures chain, e.g. VX). Retired (inactive)
    feeds are hidden unless include_inactive is true. Returns compact feed metadata: symbol, name, description,
    pyth_lazer_id, asset_type, instrument_type, state, exponent, min_channel (fastest channel the feed
    supports), quote_currency, and where set groups (entitlement groups that gate the feed), expiration_time
    and symbol_chain_id (futures). Pass verbose: true for every catalog field, e.g. market_sessions (trading-hours
    schedules) and corporate_actions (e.g. stock splits). With an access token, the list also includes
    feeds visible only to Pro keys, and each feed has `entitled`: true means this key can query the feed
    right now. When `entitled` is false, `not_entitled_reason` says why: `not_live (...)` means the feed
    is in beta, not live yet, or retired, so no key can query it (NOT a plan limitation), `requires one
    of entitlement groups: ...` means the user''s plan lacks that entitlement.'
  auth_required: false
- name: convert_date_to_timestamp
  description: Convert a date string to Unix timestamp for use with get_historical_price, get_price_range
    and get_candlestick_data. Use this tool when you need to compute timestamps — do not calculate Unix
    timestamps manually. Accepts ISO 8601 dates (e.g. '2026-01-01', '2026-01-01T12:00:00Z'). Returns seconds,
    microseconds, ISO 8601, and whether the date is within the available data range (April 2025 onward).
  auth_required: false
- name: get_candlestick_data
  description: "Fetch OHLC candlestick bars for one symbol, for charting, technical analysis or backtesting.\
    \ OHLC values are already human-readable (no exponent). Requires the user's own Pyth Pro access token.\
    \ If the user configured it in their MCP client, omit `access_token`; otherwise pass it as `access_token`,\
    \ and if the tool reports it missing, ask the user for it. Symbols can be full names from get_symbols\
    \ (e.g. 'Crypto.BTC/USD', 'Equity.US.AAPL/USD') or bare pairs like 'BTC/USD'. A bare pair resolves\
    \ to the live spot feed when there is one, otherwise to the only remaining live match; `resolved_symbols`\
    \ in the response shows what each input resolved to, and an ambiguous input returns an error listing\
    \ the candidates. `from` and `to` are Unix seconds only. Resolutions: 1/5/15/30/60 minutes, 120/240/360/720\
    \ (multi-hour), D (daily), W (weekly), M (monthly). At most 500 candles are returned; `truncated:\
    \ true` means narrow the range or use a larger resolution. Historical data is available from April\
    \ 2025 onward; do not request times before that. Price tools: get_latest_price for now, get_historical_price\
    \ for one past instant, get_price_range for every update within up to 60 seconds, get_candlestick_data\
    \ for OHLC bars over longer periods.\n\nTimestamp reference (Unix seconds):\n  2025-04-01 (earliest\
    \ available) = 1743465600\n  2026-01-01 = 1767225600\n  2026-06-01 = 1780272000\nAlways double-check\
    \ your timestamp math (year-boundary errors are common), or use convert_date_to_timestamp."
  auth_required: from 2026-07-24
- name: get_historical_price
  description: "Get the price of one or more feeds at one past instant. Requires the user's own Pyth Pro\
    \ access token. If the user configured it in their MCP client, omit `access_token`; otherwise pass\
    \ it as `access_token`, and if the tool reports it missing, ask the user for it. Symbols can be full\
    \ names from get_symbols (e.g. 'Crypto.BTC/USD', 'Equity.US.AAPL/USD') or bare pairs like 'BTC/USD'.\
    \ A bare pair resolves to the live spot feed when there is one, otherwise to the only remaining live\
    \ match; `resolved_symbols` in the response shows what each input resolved to, and an ambiguous input\
    \ returns an error listing the candidates. If both price_feed_ids and symbols are provided, only price_feed_ids\
    \ are used. The timestamp accepts Unix seconds, milliseconds or microseconds (auto-detected) and is\
    \ rounded down to the channel rate (e.g. a multiple of 200 ms for fixed_rate@200ms). Historical data\
    \ is available from April 2025 onward; do not request times before that. Requested feeds that return\
    \ no price are listed in `missing_feed_ids` (e.g. beta or coming_soon feeds, or a channel faster than\
    \ the feed's min_channel). Prices are integers with an exponent field: human-readable price = price\
    \ * 10^exponent. Pre-computed display_* fields (display_price, display_bid, display_ask, display_confidence,\
    \ display_ema_price, display_ema_confidence, display_funding_rate) apply the exponent for you. Price\
    \ tools: get_latest_price for now, get_historical_price for one past instant, get_price_range for\
    \ every update within up to 60 seconds, get_candlestick_data for OHLC bars over longer periods.\n\n\
    Timestamp reference (Unix seconds):\n  2025-04-01 (earliest available) = 1743465600\n  2026-01-01\
    \ = 1767225600\n  2026-06-01 = 1780272000\nAlways double-check your timestamp math (year-boundary\
    \ errors are common), or use convert_date_to_timestamp."
  auth_required: from 2026-07-24
- name: get_latest_price
  description: 'Get the most recent real-time price for one or more feeds. Requires the user''s own Pyth
    Pro access token. If the user configured it in their MCP client, omit `access_token`; otherwise pass
    it as `access_token`, and if the tool reports it missing, ask the user for it. Symbols can be full
    names from get_symbols (e.g. ''Crypto.BTC/USD'', ''Equity.US.AAPL/USD'') or bare pairs like ''BTC/USD''.
    A bare pair resolves to the live spot feed when there is one, otherwise to the only remaining live
    match; `resolved_symbols` in the response shows what each input resolved to, and an ambiguous input
    returns an error listing the candidates. If both price_feed_ids and symbols are provided, only price_feed_ids
    are used. Requested feeds that return no price are listed in `missing_feed_ids` (e.g. beta or coming_soon
    feeds, or a channel faster than the feed''s min_channel). Prices are integers with an exponent field:
    human-readable price = price * 10^exponent. Pre-computed display_* fields (display_price, display_bid,
    display_ask, display_confidence, display_ema_price, display_ema_confidence, display_funding_rate)
    apply the exponent for you. Price tools: get_latest_price for now, get_historical_price for one past
    instant, get_price_range for every update within up to 60 seconds, get_candlestick_data for OHLC bars
    over longer periods.'
  auth_required: true
- name: get_price_range
  description: 'Get every price update for one or more feeds within a short historical window (at most
    60 seconds), e.g. to see exactly how a price moved around an event. Requires the user''s own Pyth
    Pro access token. If the user configured it in their MCP client, omit `access_token`; otherwise pass
    it as `access_token`, and if the tool reports it missing, ask the user for it. Symbols can be full
    names from get_symbols (e.g. ''Crypto.BTC/USD'', ''Equity.US.AAPL/USD'') or bare pairs like ''BTC/USD''.
    A bare pair resolves to the live spot feed when there is one, otherwise to the only remaining live
    match; `resolved_symbols` in the response shows what each input resolved to, and an ambiguous input
    returns an error listing the candidates. If both price_feed_ids and symbols are provided, only price_feed_ids
    are used. Rows are ordered by time and interleaved across feeds; a fixed_rate@200ms channel yields
    5 rows per feed per second. When `has_more` is true, call again with `after` set to `next_cursor`
    and the same feeds, window and channel. Historical data is available from April 2025 onward; do not
    request times before that. Prices are integers with an exponent field: human-readable price = price
    * 10^exponent. Pre-computed display_* fields (display_price, display_bid, display_ask, display_confidence,
    display_ema_price, display_ema_confidence, display_funding_rate) apply the exponent for you. Price
    tools: get_latest_price for now, get_historical_price for one past instant, get_price_range for every
    update within up to 60 seconds, get_candlestick_data for OHLC bars over longer periods.'
