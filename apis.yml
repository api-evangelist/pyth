aid: pyth
name: Pyth
description: >-
  Pyth Network is a first-party financial oracle delivering real-time market data — 500+ price
  feeds spanning crypto, equities, FX, metals, rates, and commodities — to 100+ blockchains. Its
  pull-based Pyth Core oracle lets applications fetch signed prices from the Hermes service and
  verify them on-chain in a single transaction with 400ms updates, while Pyth Pro (Lazer) offers
  enterprise low-latency WebSocket streaming. Additional products include Entropy for on-chain
  randomness and Express Relay for MEV protection. Pyth exposes public REST/SSE APIs (Hermes,
  Benchmarks), first-party SDKs across TypeScript, Rust, Python and Solidity, a hosted MCP server,
  and a published agent-integration skill. Surfaced as a portfolio company of Multicoin Capital.
